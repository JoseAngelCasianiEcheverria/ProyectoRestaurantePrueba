# Perfil de desarrollo: PostgreSQL local por Docker Compose.
# Los valores por defecto coinciden con docker-compose.yml.
# Sin SSL porque el contenedor local no tiene TLS.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurante}
spring.datasource.username=${DB_USERNAME:restaurante}
spring.datasource.password=${DB_PASSWORD:restaurante}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5

# En desarrollo Hibernate crea y actualiza las tablas.
# En produccion el esquema se despliega con migraciones, nunca desde la app.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false