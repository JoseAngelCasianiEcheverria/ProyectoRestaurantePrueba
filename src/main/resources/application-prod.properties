# Perfil de produccion.
# DB_HOST, DB_USERNAME y DB_PASSWORD NO tienen valor por defecto a proposito:
# si falta alguna, la aplicacion debe fallar al arrancar y no con una
# credencial conocida.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# validate: la app no altera el esquema. Las tablas deben existir antes del deploy.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=true

server.error.include-stacktrace=never
server.error.include-message=never