spring.application.name=ProyectoRestaurantePrueba

# Perfil activo. En produccion se define SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# schema.sql es documentacion del esquema, no se ejecuta desde la app.
spring.sql.init.mode=never

# La sesion JPA se cierra en la capa de servicio; Thymeleaf recibe DTOs.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=UTF-8

spring.web.resources.cache.cachecontrol.no-cache=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.com.jcaa.restaurante=INFO